<!doctype html>
<!-- Esempio ricostruito: Search field, variante 2 (parola che diventa campo). © Francesco Zaccaria, codice con licenza MIT. -->
<html lang="en" data-lingua="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search field 2 — UI Design: Components</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../base.css">
<script src="../../assets/lingua.js"></script>
<style>
  .apri { display: flex; align-items: center; min-height: 64px; }
  .parola { border: 0; background: none; padding: 4px 0; cursor: pointer; font-size: 28px; font-weight: 500; letter-spacing: -.01em; border-bottom: 2px solid transparent; transition: border-color .2s; }
  .parola:hover { border-bottom-color: #111; }
  .parola[hidden], .linea[hidden] { display: none; }
  .linea { display: flex; align-items: center; gap: 12px; width: 100%; animation: compare .25s ease-out; }
  .campo { position: relative; flex: 1; min-width: 0; }
  .campo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #111; transform-origin: left; animation: traccia .35s cubic-bezier(.2,.7,.2,1); }
  .campo input { width: 100%; border: 0; outline: 0; background: none; font-size: 28px; font-weight: 500; padding: 4px 0 6px; }
  .campo input::-webkit-search-cancel-button { display: none; }
  .segnaposto { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-size: 28px; color: rgba(0,0,0,.28); pointer-events: none; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .segnaposto[hidden] { display: none; }
  .trova { border: 0; background: #111; color: #fff; border-radius: 9999px; padding: 10px 18px; cursor: pointer; font-size: 16px; }
  .trova:hover { background: var(--c-blu); }
  .esc { border: 1px solid var(--c-linea); background: var(--c-palco); border-radius: 9999px; padding: 3px 8px; cursor: pointer; font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; color: var(--c-tenue); }
  .esc:hover { border-color: #111; color: #111; }
  @keyframes traccia { from { transform: scaleX(0); } }
  @keyframes compare { from { opacity: 0; } }
</style>
</head>
<body>
<div class="palco">
  <div class="riquadro">
    <span class="didascalia"><span data-l="it">Parola che diventa campo</span><span data-l="en">Word that becomes a field</span><span data-l="fr">Mot qui devient un champ</span><span data-l="zh">变成搜索框的文字</span></span>
    <div class="apri">
      <button class="parola" type="button" id="parola" aria-expanded="false" aria-controls="form"><span data-l="it">Cerca</span><span data-l="en">Search</span><span data-l="fr">Rechercher</span><span data-l="zh">搜索</span></button>
      <form class="linea" role="search" id="form" hidden>
        <span class="campo">
          <input type="search" id="q" autocomplete="off" aria-label="Search">
          <span class="segnaposto" id="seg" aria-hidden="true"><span data-l="it">Scrivi qualcosa…</span><span data-l="en">Type something…</span><span data-l="fr">Tapez quelque chose…</span><span data-l="zh">输入内容…</span></span>
        </span>
        <button class="trova" type="submit"><span data-l="it">Trova</span><span data-l="en">Find</span><span data-l="fr">Trouver</span><span data-l="zh">查找</span></button>
        <button class="esc" type="button" id="esc" aria-label="Close search" title="Esc">ESC</button>
      </form>
    </div>
  </div>
</div>
<script>
  var parola = document.getElementById('parola'), form = document.getElementById('form'), q = document.getElementById('q'), seg = document.getElementById('seg');
  function apri() { parola.hidden = true; parola.setAttribute('aria-expanded', 'true'); form.hidden = false; q.value = ''; seg.hidden = false; q.focus(); }
  function chiudi() { form.hidden = true; parola.hidden = false; parola.setAttribute('aria-expanded', 'false'); parola.focus(); }
  parola.onclick = apri;
  document.getElementById('esc').onclick = chiudi;
  form.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); chiudi(); } });
  q.addEventListener('input', function () { seg.hidden = !!q.value; });
  form.onsubmit = function (e) { e.preventDefault(); q.focus(); };
</script>
</body>
</html>
